# Go Report Card configuration
# Excludes paths that are not part of the published module:
#   .claude    — Claude Code agent worktrees and session state
#   competitor — vendored third-party routers used only for benchmark comparisons
#   examples   — demo applications, not part of the importable API
#   reports    — security-audit harnesses and report markdown
exclude_dirs:
  - ".claude"
  - "competitor"
  - "examples"
  - "reports"
