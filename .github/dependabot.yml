version: 2

updates:
  # GitHub Actions versions used by every workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # Go modules. Only modules with third-party dependencies are listed: the
  # root module and the examples have none, and /competitor is
  # git-ignored. The security harnesses below are separate modules that CI
  # tests (ci.yml "Harness tests", fuzz.yml).
  - package-ecosystem: gomod
    # golang.org/x/net and golang.org/x/text (HTTP/2 harness)
    directory: /reports/http-protocol-security-auditor/harness/h2harness
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: gomod
    # chi, httprouter, bunrouter and testify (differential fuzzing)
    directory: /reports/path-routing-fuzzer/harness
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: gomod
    # pgregory.net/rapid (property-based tests)
    directory: /reports/fuzzing-and-property-engineer/harness
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore"
      include: scope
