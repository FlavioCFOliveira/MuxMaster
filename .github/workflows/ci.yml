name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires go 1.26; "stable" catches future releases
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ matrix.go }}

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build $(go list ./... | grep -v '/reports/')

      - name: Test
        run: go test -count=1 $(go list ./... | grep -v '/reports/')

      - name: Test (race detector)
        run: go test -race -count=1 $(go list ./... | grep -v '/reports/')

      - name: Vet
        run: go vet $(go list ./... | grep -v '/reports/')

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4

  staticcheck:
    name: SAST (staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        # /reports contains intentional anti-patterns (exploit reproducers); excluded.
        run: staticcheck $(go list ./... | grep -v '/reports/')

  gosec:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Run gosec
        # @master is the upstream-recommended pin (pinned to latest stable release).
        # See: https://github.com/securego/gosec#integrating-with-github-actions
        uses: securego/gosec@master
        with:
          args: -exclude-dir=reports -severity=medium ./...

  vulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck $(go list ./... | grep -v '/reports/')

  api-md-fresh:
    name: api.md is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Regenerate api.md
        run: make api

      - name: Diff
        run: |
          if ! git diff --quiet -- api.md; then
            echo "::error::api.md is out of date. Run 'make api' and commit the result."
            git diff -- api.md
            exit 1
          fi

  api-diff:
    name: API breaking-change check (apidiff)
    runs-on: ubuntu-latest
    # Only run on PRs targeting main; pushes to main use this for advisory
    # output but never fail the merge (the comparison is against the latest
    # tag, which the merge will have updated).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0   # full history so we can resolve tags

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@latest

      - name: Resolve baseline tag
        id: baseline
        run: |
          tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$tag" ]; then
            tag=$(git tag --sort=-v:refname | head -1)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Comparing against ${tag:-(no tag)}"

      - name: Compare API surface
        if: steps.baseline.outputs.tag != ''
        run: |
          set -euo pipefail
          tag="${{ steps.baseline.outputs.tag }}"
          # Snapshot of the baseline export.
          git worktree add /tmp/baseline "$tag"
          (cd /tmp/baseline && apidiff -w /tmp/baseline.api .)
          # Compare against HEAD.
          report=$(apidiff /tmp/baseline.api . || true)
          echo "$report"
          # If incompatible changes are listed, fail unless the PR carries
          # the api-break label.
          if echo "$report" | grep -qiE '^Incompatible changes'; then
            labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
            if echo "$labels" | grep -q 'api-break'; then
              echo "PR is labelled api-break — incompatible changes accepted."
            else
              echo "::error::Incompatible API changes detected. Either revert or add the 'api-break' label and document in CHANGELOG."
              exit 1
            fi
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v '/reports/')

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Coverage gate (>= 80%)
        # COV-2026-013: fail CI if total coverage drops below 80%. The
        # threshold ratchets up as new tests land — bumped in a separate
        # commit when the floor is comfortably exceeded.
        run: |
          set -euo pipefail
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($NF, 1, length($NF)-1)}')
          echo "Total coverage: ${coverage}%"
          awk -v c="$coverage" -v t=80 'BEGIN { if (c+0 < t+0) { print "FAIL: coverage " c "% < " t "%"; exit 1 } print "OK: coverage " c "% >= " t "%" }'
