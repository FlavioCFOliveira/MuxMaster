name: CI

on:
  # gitflow without pull requests: sprint, release and hotfix work reaches
  # develop and main by direct pushes, so every gitflow branch is tested
  # on push. The pull_request trigger covers external contributions.
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires go 1.27.1; "stable" catches future releases
        go: ["1.27.1", "stable"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # CI-2026-005: race detector is well-supported across all 3 OSes;
        # if a Windows-specific path quirk emerges, scope it via build tags.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Verify modules
        run: go mod verify

      # The shell trick: bash on every runner (Windows ships git-bash via
      # actions/setup-go), so the `grep -v '/reports/'` pipeline is portable.
      - name: Build
        shell: bash
        run: go build $(go list ./... | grep -v '/reports/')

      - name: Test
        shell: bash
        run: go test -count=1 $(go list ./... | grep -v '/reports/')

      - name: Test (race detector)
        shell: bash
        run: go test -race -count=1 $(go list ./... | grep -v '/reports/')

      - name: Vet
        shell: bash
        run: go vet $(go list ./... | grep -v '/reports/')

  test-arm64:
    name: Test (linux/arm64)
    runs-on: ubuntu-latest
    # CI-2026-006: separate ARM64 job using QEMU emulation to validate
    # atomics + unsafe.Add behaviour on a different memory model. Slower
    # than native arm64 runners but available on free-tier minutes.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Test in arm64 container
        run: |
          docker run --rm --platform=linux/arm64 \
            -v "$PWD:/work" -w /work \
            -e CGO_ENABLED=0 \
            golang:1.27.1 \
            sh -c 'go test -count=1 $(go list ./... | grep -v "/reports/")'

  harness-test:
    name: Harness tests (security auditors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # rmp #289: Test harness modules to ensure SAST/security auditors
    # exercise current MuxMaster code (not stale vendor copies).
    # Separate from fast unit tests to avoid bloating PR latency.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet root-level harness packages
        shell: bash
        run: |
          set -euo pipefail
          # Root-level harnesses (no go.mod of their own, use main module).
          # Includes all sub-packages (use /...).
          # Excluded: timing-and-sidechannel-analyst (build tag timing, nightly only).
          go vet ./reports/http-protocol-security-auditor/harness/...
          go vet ./reports/concurrency-security-auditor/harness/...

      - name: Test root-level harness packages (-race)
        shell: bash
        run: |
          set -euo pipefail
          # Root-level harnesses: http-protocol-auditor and concurrency-auditor.
          # Skips timing-and-sidechannel-analyst (long-running, nightly only).
          go test -race -count=1 -short ./reports/http-protocol-security-auditor/harness/...
          go test -race -count=1 -short ./reports/concurrency-security-auditor/harness/...

      - name: Test harness modules (explicit list, -mod=mod)
        shell: bash
        run: |
          set -euo pipefail
          # Module harnesses with go.mod (exclude benchmarks: perf-lab and
          # dos-resilience-tester/2026-05-08-loadtest).
          #
          # rmp #292: reports/fuzzing-and-property-engineer/harness runs here
          # (-short) so its seed corpora execute as ordinary unit tests on
          # every PR. fuzz.yml's nightly job only runs `-fuzz=...` (mutation
          # fuzzing, `-run='^$'` skips the seed corpus as unit tests) — it
          # never exercised the corpus this way, which is how a seed-corpus
          # regression (FuzzMount panicking on a context-less request,
          # CSA-2026-00xx) went undetected by CI until this was added.
          harnesses=(
            "reports/path-routing-fuzzer/harness"
            "reports/dos-resilience-tester/harness"
            "reports/middleware-security-reviewer/harness"
            "reports/middleware-security-reviewer/harness/2026-05-08-S10-PreMSR"
            "reports/http-protocol-security-auditor/harness/h2harness"
            "reports/fuzzing-and-property-engineer/harness"
          )
          for harness in "${harnesses[@]}"; do
            echo "::group::Testing $harness"
            cd "$harness"
            # Use -mod=mod to bypass vendor; replace directives ensure current code
            go test -mod=mod -race -count=1 -short ./...
            cd - > /dev/null
            echo "::endgroup::"
          done

  gotip:
    name: Go tip (canary)
    runs-on: ubuntu-latest
    continue-on-error: true
    # rmp #289: Early warning for breaking changes to http.Request layout
    # on Go tip. The reqbundle optimisation uses unsafe.Pointer to set the
    # private ctx field; a future Go version may remove or move it.
    # rmp #289: Allowed to fail without blocking PR merge (advisory only).
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Go tip
        # actions/setup-go does not support go-version: tip; install gotip binary
        run: |
          go install golang.org/dl/gotip@latest
          gotip download

      - name: Build root package (Go tip)
        run: gotip build -v .

      - name: Test layout assumptions (Go tip)
        # rmp #289: Validates http.Request.ctx field offset is still accessible
        # via reflect. Includes layout_test.go and reqbundle_test.go.
        run: gotip test -v -run="TestBundle|TestReqBundle" .

      - name: Test root package (Go tip, -race)
        # rmp #289: Early warning for race conditions on tip
        run: gotip test -race -count=1 $(gotip list ./... | grep -v '/reports/')

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  staticcheck:
    name: SAST (staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        # /reports contains intentional anti-patterns (exploit reproducers); excluded.
        run: staticcheck $(go list ./... | grep -v '/reports/')

      - name: pkg.go.dev quality gate (godoc + naming)
        # API-2026-008: enforce the same checks pkg.go.dev surfaces in
        # the "Documentation" tab so a fresh deploy never shows warnings.
        run: |
          staticcheck -checks=ST1000,ST1020,ST1021,ST1022,ST1003 \
            $(go list ./... | grep -v '/reports/' | grep -v '/competitor/' | grep -v '/examples/')

  gosec:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gosec
        # Installed from source with the Go toolchain from go.mod, like
        # staticcheck and govulncheck. The securego/gosec Docker action is
        # not used: its images pin GOTOOLCHAIN=local with an older Go (the
        # v2.29.0 action runs a go1.26.5 image, master a go1.27.0 one), so
        # they cannot load a module that requires go 1.27.1.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        run: gosec -exclude-dir=reports -severity=medium ./...

  vulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck $(go list ./... | grep -v '/reports/')

  semgrep-custom:
    name: SAST (semgrep custom rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install semgrep
        # Pinned version for reproducibility
        run: pip install semgrep==1.178.0

      - name: Test custom semgrep rules
        # Validate rule syntax and test cases
        run: semgrep --test reports/go-sast-and-memory-auditor/semgrep-rules/

      - name: Run semgrep with custom MuxMaster rules
        # Custom rule file at reports/go-sast-and-memory-auditor/semgrep-rules/muxmaster.yml
        # Scans the root Go package, excluding: reports/**, competitor/**, testdata/**, .claude/**
        run: |
          semgrep scan \
            --config reports/go-sast-and-memory-auditor/semgrep-rules/muxmaster.yml \
            --error \
            --exclude=reports \
            --exclude=competitor \
            --exclude=testdata \
            --exclude=.claude \
            .

  changelog-touched:
    name: CHANGELOG.md updated
    runs-on: ubuntu-latest
    # Runs on push as well as on pull_request: the project merges gitflow
    # branches by direct pushes, so a PR-only gate would never run.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG entry on behavioural changes
        # CI-2026-016: changes touching .go files (excluding _test.go,
        # /reports/, /competitor/, /examples/) must update CHANGELOG.md
        # under [Unreleased]. Pure-test or doc-only changes are exempt.
        # Pull requests can override with the 'no-changelog' label; pushes
        # have no override.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          elif [ "$PUSH_BEFORE" != "$zero" ] &&
               git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null &&
               git merge-base --is-ancestor "$PUSH_BEFORE" "$PUSH_AFTER"; then
            # Fast-forward push: the net change the push introduced.
            changed=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")
          else
            # New branch (zero "before" SHA) or forced push ("before" is
            # unknown or not an ancestor): the files touched by the commits
            # that no other branch or tag already contains.
            branch="${PUSH_REF#refs/heads/}"
            mapfile -t others < <(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags |
              grep -vxF -e "refs/remotes/origin/${branch}" -e "refs/remotes/origin/HEAD" || true)
            changed=$(git log --format= --name-only --no-merges "$PUSH_AFTER" --not "${others[@]}" | sort -u)
          fi

          # Behavioural change = any non-test .go outside excluded dirs
          beh=$(grep -E '\.go$' <<<"$changed" | grep -vE '_test\.go$' | grep -vE '^reports/|^competitor/|^examples/' || true)
          if [ -z "$beh" ]; then
            echo "No behavioural .go changes — CHANGELOG check skipped."
            exit 0
          fi

          if grep -qx 'CHANGELOG\.md' <<<"$changed"; then
            echo "CHANGELOG.md updated."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && grep -q 'no-changelog' <<<"$PR_LABELS"; then
            echo "PR carries 'no-changelog' label — exempt."
            exit 0
          fi

          echo "::error::Behavioural .go changes detected without a CHANGELOG.md update."
          echo "Add an entry under [Unreleased] (pull requests may instead apply the 'no-changelog' label)."
          echo ""
          echo "Files changed:"
          echo "$beh"
          exit 1

  api-md-fresh:
    name: api.md is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate api.md
        run: make api

      - name: Diff
        run: |
          if ! git diff --quiet -- api.md; then
            echo "::error::api.md is out of date. Run 'make api' and commit the result."
            git diff -- api.md
            exit 1
          fi

  api-diff:
    name: API breaking-change check (apidiff)
    runs-on: ubuntu-latest
    # Compares the root package API with the latest release tag reachable
    # from the checked-out commit.
    # - pull_request: incompatible changes fail the job unless the PR
    #   carries the 'api-break' label.
    # - push: advisory only. Incompatible changes are reported as a
    #   warning annotation and in the job summary; the job never fails.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # full history so we can resolve tags

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@latest

      - name: Resolve baseline tag
        id: baseline
        run: |
          # Latest release tag (vX.Y.Z, no pre-release suffix) reachable
          # from HEAD; empty when there is none.
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::No release tag reachable from HEAD; API comparison skipped."
            echo "apidiff: no release tag reachable from HEAD; comparison skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Comparing against $tag"
          fi

      - name: Compare API surface
        if: steps.baseline.outputs.tag != ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_TAG: ${{ steps.baseline.outputs.tag }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          advisory=true
          [ "$EVENT_NAME" = "pull_request" ] && advisory=false

          # apidiff exits 0 whether or not it finds changes; a non-zero exit
          # means the tool itself failed. That fails a pull request (the
          # check could not run) and is only a warning on push.
          base_dir="$RUNNER_TEMP/apidiff-baseline"
          if ! { git worktree add --detach "$base_dir" "$BASE_TAG" &&
                 (cd "$base_dir" && apidiff -w "$RUNNER_TEMP/baseline.api" .) &&
                 report=$(apidiff "$RUNNER_TEMP/baseline.api" .); }; then
            if $advisory; then
              echo "::warning::apidiff could not compare the API against $BASE_TAG."
              exit 0
            fi
            echo "::error::apidiff could not compare the API against $BASE_TAG."
            exit 1
          fi
          echo "$report"
          {
            echo "### API changes since $BASE_TAG"
            echo '```'
            echo "${report:-No API changes.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -qiE '^Incompatible changes' <<<"$report"; then
            if $advisory; then
              echo "::warning::Incompatible API changes since $BASE_TAG (advisory on push; see the job summary)."
            elif grep -q 'api-break' <<<"$PR_LABELS"; then
              echo "PR is labelled api-break — incompatible changes accepted."
            else
              echo "::error::Incompatible API changes detected. Either revert or add the 'api-break' label and document in CHANGELOG."
              exit 1
            fi
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v '/reports/')

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Coverage gate (>= 80%)
        # COV-2026-013: fail CI if total coverage drops below 80%. The
        # threshold ratchets up as new tests land — bumped in a separate
        # commit when the floor is comfortably exceeded.
        run: |
          set -euo pipefail
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($NF, 1, length($NF)-1)}')
          echo "Total coverage: ${coverage}%"
          awk -v c="$coverage" -v t=80 'BEGIN { if (c+0 < t+0) { print "FAIL: coverage " c "% < " t "%"; exit 1 } print "OK: coverage " c "% >= " t "%" }'

