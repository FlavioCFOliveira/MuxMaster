name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires go 1.26; "stable" catches future releases
        go: ["1.26", "stable"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # CI-2026-005: race detector is well-supported across all 3 OSes;
        # if a Windows-specific path quirk emerges, scope it via build tags.
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ matrix.go }}

      - name: Verify modules
        run: go mod verify

      # The shell trick: bash on every runner (Windows ships git-bash via
      # actions/setup-go), so the `grep -v '/reports/'` pipeline is portable.
      - name: Build
        shell: bash
        run: go build $(go list ./... | grep -v '/reports/')

      - name: Test
        shell: bash
        run: go test -count=1 $(go list ./... | grep -v '/reports/')

      - name: Test (race detector)
        shell: bash
        run: go test -race -count=1 $(go list ./... | grep -v '/reports/')

      - name: Vet
        shell: bash
        run: go vet $(go list ./... | grep -v '/reports/')

  test-arm64:
    name: Test (linux/arm64)
    runs-on: ubuntu-latest
    # CI-2026-006: separate ARM64 job using QEMU emulation to validate
    # atomics + unsafe.Add behaviour on a different memory model. Slower
    # than native arm64 runners but available on free-tier minutes.
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Test in arm64 container
        run: |
          docker run --rm --platform=linux/arm64 \
            -v "$PWD:/work" -w /work \
            -e CGO_ENABLED=0 \
            golang:1.26 \
            sh -c 'go test -count=1 $(go list ./... | grep -v "/reports/")'

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.11.4

  staticcheck:
    name: SAST (staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        # /reports contains intentional anti-patterns (exploit reproducers); excluded.
        run: staticcheck $(go list ./... | grep -v '/reports/')

      - name: pkg.go.dev quality gate (godoc + naming)
        # API-2026-008: enforce the same checks pkg.go.dev surfaces in
        # the "Documentation" tab so a fresh deploy never shows warnings.
        run: |
          staticcheck -checks=ST1000,ST1020,ST1021,ST1022,ST1003 \
            $(go list ./... | grep -v '/reports/' | grep -v '/competitor/' | grep -v '/examples/')

  gosec:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Run gosec
        # @master is the upstream-recommended pin (pinned to latest stable release).
        # See: https://github.com/securego/gosec#integrating-with-github-actions
        uses: securego/gosec@master
        with:
          args: -exclude-dir=reports -severity=medium ./...

  vulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck $(go list ./... | grep -v '/reports/')

  changelog-touched:
    name: CHANGELOG.md updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG entry on behavioural changes
        # CI-2026-016: PRs touching .go files (excluding _test.go,
        # /reports/, /competitor/, /examples/) must update CHANGELOG.md
        # under [Unreleased]. Pure-test or doc-only PRs are exempt.
        # Override with the 'no-changelog' label.
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")

          # Behavioural change = any non-test .go outside excluded dirs
          beh=$(echo "$changed" | grep -E '\.go$' | grep -vE '_test\.go$' | grep -vE '^reports/|^competitor/|^examples/' || true)
          if [ -z "$beh" ]; then
            echo "No behavioural .go changes — CHANGELOG check skipped."
            exit 0
          fi

          if echo "$changed" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md updated."
            exit 0
          fi

          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | grep -q 'no-changelog'; then
            echo "PR carries 'no-changelog' label — exempt."
            exit 0
          fi

          echo "::error::Behavioural .go changes detected without a CHANGELOG.md update."
          echo "Either add an entry under [Unreleased] or apply the 'no-changelog' label if this is intentional."
          echo ""
          echo "Files changed:"
          echo "$beh"
          exit 1

  api-md-fresh:
    name: api.md is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Regenerate api.md
        run: make api

      - name: Diff
        run: |
          if ! git diff --quiet -- api.md; then
            echo "::error::api.md is out of date. Run 'make api' and commit the result."
            git diff -- api.md
            exit 1
          fi

  api-diff:
    name: API breaking-change check (apidiff)
    runs-on: ubuntu-latest
    # Only run on PRs targeting main; pushes to main use this for advisory
    # output but never fail the merge (the comparison is against the latest
    # tag, which the merge will have updated).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0   # full history so we can resolve tags

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@latest

      - name: Resolve baseline tag
        id: baseline
        run: |
          tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$tag" ]; then
            tag=$(git tag --sort=-v:refname | head -1)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Comparing against ${tag:-(no tag)}"

      - name: Compare API surface
        if: steps.baseline.outputs.tag != ''
        run: |
          set -euo pipefail
          tag="${{ steps.baseline.outputs.tag }}"
          # Snapshot of the baseline export.
          git worktree add /tmp/baseline "$tag"
          (cd /tmp/baseline && apidiff -w /tmp/baseline.api .)
          # Compare against HEAD.
          report=$(apidiff /tmp/baseline.api . || true)
          echo "$report"
          # If incompatible changes are listed, fail unless the PR carries
          # the api-break label.
          if echo "$report" | grep -qiE '^Incompatible changes'; then
            labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
            if echo "$labels" | grep -q 'api-break'; then
              echo "PR is labelled api-break — incompatible changes accepted."
            else
              echo "::error::Incompatible API changes detected. Either revert or add the 'api-break' label and document in CHANGELOG."
              exit 1
            fi
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v '/reports/')

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Coverage gate (>= 80%)
        # COV-2026-013: fail CI if total coverage drops below 80%. The
        # threshold ratchets up as new tests land — bumped in a separate
        # commit when the floor is comfortably exceeded.
        run: |
          set -euo pipefail
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($NF, 1, length($NF)-1)}')
          echo "Total coverage: ${coverage}%"
          awk -v c="$coverage" -v t=80 'BEGIN { if (c+0 < t+0) { print "FAIL: coverage " c "% < " t "%"; exit 1 } print "OK: coverage " c "% >= " t "%" }'
