name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write   # for creating GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      # On workflow_dispatch, check out the requested tag (not the branch
      # the run was dispatched from) so the test gate exercises the code
      # being released. A tag that does not exist fails the checkout.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - id: t
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $tag does not match SemVer vX.Y.Z[-prerelease]"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Test gate (must be green at tag)
        run: go test -race -count=1 $(go list ./... | grep -v '/reports/')

  sbom:
    name: Generate SBOM (CycloneDX)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - name: Generate SBOM
        run: cyclonedx-gomod mod -licenses -json -output sbom.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [validate, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Extract release notes from CHANGELOG.md
        # The notes are written to a file and passed with body_path. A job
        # output must not carry them: GitHub drops any output it suspects
        # may contain a secret ("Skip output 'notes' since it may contain
        # secret"), which left the v1.2.0 release body empty.
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          # CHANGELOG headings are "## [X.Y.Z] - YYYY-MM-DD"; the tag is "vX.Y.Z".
          ver="${TAG#v}"
          # Print the lines between this version's heading and the next
          # "## " heading. index() matches the literal "[X.Y.Z]" so the dots
          # are not regex wildcards; the trailing "]" keeps 1.0.0 from
          # matching 1.0.0-rc1. Leading and trailing blank lines are dropped.
          awk -v hdr="[${ver}]" '
            /^## / {
              if (in_section) exit
              if (index($0, "## " hdr) == 1) in_section = 1
              next
            }
            in_section {
              if ($0 ~ /^[[:space:]]*$/) { blank++; next }
              if (printed) for (i = 0; i < blank; i++) print ""
              blank = 0; printed = 1; print
            }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for ${ver}; using a pointer to CHANGELOG.md."
            echo "See [CHANGELOG.md](CHANGELOG.md)." > release-notes.md
          fi
          echo "Release notes: $(wc -l < release-notes.md) line(s)"

      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: ./artifacts

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
          files: |
            artifacts/sbom.json
          fail_on_unmatched_files: true
