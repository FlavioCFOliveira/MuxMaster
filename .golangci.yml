linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - "disableStutteringCheck"

issues:
  exclude-dirs:
    - reports
    - competitor
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
        - revive
    - path: "(params|mux)\\.go"
      linters:
        - govet
      text: "unsafeptr"
    - path: "params\\.go"
      linters:
        - revive
      text: "context-as-argument"
